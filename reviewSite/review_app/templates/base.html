{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="{% static 'css/styles.css' %}"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="{% static 'css/album_list.css' %}"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="{% static 'css/album_detail.css' %}"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="{% static 'css/my_reviews.css' %}"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="{% static 'css/create_review.css' %}"
    />
    <title>Album Top 30 of 2025</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script type="text/javascript" src="{% static 'js/sidebar.js' %}"></script>
  </head>
  <body>
    <nav>
      <button id="burger" onclick="toggleSidebar()">
        <i class="bi bi-list" style="font-size: 1.5rem"></i>
      </button>
    </nav>
    <aside id="sidebar">{% include "sidebar.html" %}</aside>
    <main>{% block content %} {% endblock %}</main>
  </body>
</html>
