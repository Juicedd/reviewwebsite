<div class="sidebar_header">
  <i class="bi bi-music-note-beamed"></i>
  <h1>Melodyze</h1>
</div>

<div class="sidebar_nav" role="navigation" aria-label="Main navigation">
  <a
    href="{% url 'album_list' %}"
    class="sidebar_nav_item {% if request.resolver_match.url_name == 'album_list' %}active{% endif %}"
    {% if request.resolver_match.url_name == 'album_list' %}aria-current="page"{% endif %}
  >
    <i class="bi bi-house-door me-2" aria-hidden="true"></i> <span>Home</span>
  </a>
  <a
    href="{% url 'my_reviews' %}"
    class="sidebar_nav_item {% if request.resolver_match.url_name == 'my_reviews' %}active{% endif %}"
    {% if request.resolver_match.url_name == 'my_reviews' %}aria-current="page"{% endif %}
  >
    <i class="bi bi-chat-right-heart me-2" aria-hidden="true"></i>
    <span>My Reviews</span>
  </a>
  <a
    href="{% url 'dashboard' %}"
    class="sidebar_nav_item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
    {% if request.resolver_match.url_name == 'dashboard' %}aria-current="page"{% endif %}
  >
    <i class="bi bi-bar-chart me-2" aria-hidden="true"></i> <span>Dashboard</span>
  </a>
  <a
    href="{% url 'archive' %}"
    class="sidebar_nav_item {% if request.resolver_match.url_name == 'archive' %}active{% endif %}"
    {% if request.resolver_match.url_name == 'archive' %}aria-current="page"{% endif %}
  >
    <i class="bi bi-archive me-2" aria-hidden="true"></i> <span>Archive</span>
  </a>
</div>

<div class="sidebar_logout_container">
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit" class="sidebar_nav_item border-0" aria-label="Logout from Melodyze">
      <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>
      <span>Logout</span>
    </button>
  </form>
</div>
